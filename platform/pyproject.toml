[project]
name = "sandbox-platform"
version = "0.1.0"
description = "沙箱平台控制面核心模块（生命周期编排、用户与子 ID 段管理、镜像与挂载装配、元数据存储）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    # 下界 15.0：uvicorn 的 sansio WebSocket 实现（--ws auto 默认选中它）
    # 直接 import 顶层 websockets.server 模块取 ServerProtocol，
    # 该模块只在 websockets 14.0 起的新 asyncio 实现里存在；
    # 版本更低会让服务在启动时直接 ImportError，网页终端根本起不来。
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_platform"]

[tool.ruff.lint]
# 仓库历史基线规则集：只保留 pyflakes 错误（E4 导入、E7 语句、E9 运行时）
# 与 pyflakes 未定义名（F）这几类致命问题。
#
# 为什么不用 ruff 的默认规则集：新版 ruff 默认选中的规则集在仓库里命中 59 处
# 历史风格项（未排序导入 18 处、函数默认值里的函数调用 19 处、宽泛 except 8 处等），
# 全部是既有代码的既有写法，不在本轮清偿范围。真要一次性清偿会制造大量无关改动，
# 掩盖本轮模板轮的真实差异。因此这里显式把口径钉死在历史基线上，
# 往后新写的代码按基线规则守住，风格清债另开一轮。
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "root: 需要真实 root 权限与 systemd 用户会话的宿主级测试",
]
filterwarnings = ["error::DeprecationWarning:sandbox_platform.*"]
