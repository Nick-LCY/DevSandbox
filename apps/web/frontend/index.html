<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沙箱平台控制台</title>
    <script>
      // 防闪烁主题脚本：首帧渲染前就把主题类挂到 <html> 上，避免先亮一下再切暗色。
      // 只认用户明确选过的值（'dark' 才挂 dark 类）；读取失败（隐私模式等）一律留亮色。
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('sandbox-console-theme');
          if (stored === 'dark') {
            theme = 'dark';
          }
        } catch (e) {
          theme = 'light';
        }
        var root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        }
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!--
      静态外壳：后端健康门禁要读原始 HTML 里的 data-testid，
      React 挂载后会把这段占位内容替换成真正的页面。
    -->
    <div id="root">
      <h1 data-testid="page-layout-title">沙箱平台控制台</h1>
      <p data-testid="page-layout-loading">控制台正在加载…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
