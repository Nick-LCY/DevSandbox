[package]
name = "sandbox-console-desktop"
version = "0.1.0"
description = "沙箱平台控制台桌面端（Tauri v2 壳）"
authors = ["sandbox-platform"]
edition = "2021"
# tauri 2.12.5（见 Cargo.lock）要求 rustc ≥ 1.90，这里与之保持一致
rust-version = "1.90"

# 桌面壳只做三件事：装载前端静态产物、按连接配置设定 CSP、维护端口转发的本机监听与隧道桥接。
# 端口转发的 Rust 侧能力见 src/forward.rs（任务 06 落地）。
[build-dependencies]
# config-json5：让 tauri.conf.json 能带注释（窗口在 Rust 侧建，注释指向 main.rs）。
# 与 tauri-cli 的解析口径一致（CLI 恒开 config-json5）。
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
# config-json5：同上（generate_context! 宏在编译期读 tauri.conf.json）。
tauri = { version = "2", features = ["config-json5"] }
# serde / serde_json：端口转发的命令入参、事件载荷与隧道控制帧都要读写 JSON。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio：本机 TCP 监听（tokio::net）、隧道桥接与下载落盘的异步运行时。
# Tauri 自带的异步运行时就是 tokio，这里显式声明我们直接用到的那些能力
# （fs = 下载落盘的临时名 / rename / 清理）。
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "macros", "sync", "time"] }
# tokio-tungstenite：隧道 WebSocket 客户端（ws / wss 都走它）。
# rustls-tls-webpki-roots：wss 时的 TLS（纯 Rust，不依赖系统 OpenSSL，Windows 出包省事）。
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# rustls：显式指定唯一的 crypto provider（ring）。
# tokio-tungstenite 只以 default-features = false 引 rustls / tokio-rustls，
# 不会带进任何 provider；不显式声明的话，wss 建连时 rustls 0.23 会在
# ClientConfig::builder() 处 panic（Could not automatically determine the
# process-level CryptoProvider）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# futures-util：隧道流的 split / SinkExt / StreamExt（字节泵用）。
futures-util = { version = "0.3", features = ["sink"] }
# tokio-util：CancellationToken——停止转发时一次性收掉监听与全部连接；
# 下载落盘也用它做「中途取消」的单向信号（`download.rs`）。
tokio-util = { version = "0.7", features = ["rt"] }
# reqwest：桌面端下载落盘的 HTTP 客户端（流式 GET → 写盘）。
# - `rustls-tls` = rustls + webpki 根证书（**纯 Rust，不引 OpenSSL**），与 forward.rs 的
#   `tokio-tungstenite/rustls-tls-webpki-roots` + `rustls(ring)` 是同一套 TLS 栈；
# - **不要 `stream` 特性**：流式读用的 `Response::chunk()` 在 reqwest 0.12.28 里
#   不受 `stream` 门控（只有 `bytes_stream()` 要），我们没用到后者；
# - `default-features = false`：不要 native-tls / 系统代理 / charset / http2。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# tauri-plugin-dialog：下载落盘的**原生「保存为」对话框**（用户在框里选路径）。
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
